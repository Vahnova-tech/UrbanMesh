# UrbanMesh on Render: one web service + PostGIS Postgres.
# Dashboard → New Blueprint → this repo. See RENDER.md.

databases:
  - name: urbanmesh-db
    databaseName: urbanmesh
    user: urbanmesh
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: urbanmesh
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: urbanmesh-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: urbanmesh-db
          property: connectionString
      - key: CLUSTER_RADIUS_METERS
        value: "15"
      - key: CLUSTER_THRESHOLD
        value: "3"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REPORTS
        value: "10"
      - key: PHOTO_STORAGE_PATH
        value: /var/data/photos
      - key: LPDP_STORAGE_DIR
        value: /var/data/lpdp
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: WEB_DIST
        value: /app/apps/web/dist
      - key: DASHBOARD_DIST
        value: /app/apps/dashboard/dist
      - key: CORS_ORIGINS
        value: https://urbanmesh.space,https://www.urbanmesh.space,http://localhost:5173,http://localhost:5174
